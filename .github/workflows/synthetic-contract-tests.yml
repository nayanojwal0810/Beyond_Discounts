name: Synthetic Contract Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  synthetic-contracts:
    name: Data-independent regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytical runtime
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn
      - name: Run data-independent gate contracts
        run: python -m unittest discover -s tests -p "test_gate1d_contracts.py" -v
