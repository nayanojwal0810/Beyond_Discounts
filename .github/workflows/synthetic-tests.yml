name: Synthetic-safe tests

on:
  push:
    branches:
      - main
      - "review/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned direct dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project Python files
        run: python -m compileall -q scripts tests

      - name: Run clustering tests (synthetic fixture when local matrices are absent)
        run: python -m unittest discover -s tests -p "test_segmentation_experiments.py" -v

      - name: Run lifecycle CRM analysis unit tests (synthetic-only fixtures)
        run: python -m unittest discover -s tests -p "test_crm_analysis.py" -v
